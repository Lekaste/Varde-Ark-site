<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f3ee">
  <title>Varde Ark — Under utvikling</title>

  <style>
    :root {
      --background: #f5f3ee;
      --foreground: #171816;
      --muted: #696b66;
      --line: rgba(23, 24, 22, 0.14);
      --page-padding: clamp(1.5rem, 5vw, 5rem);
      --title-size: clamp(3.4rem, 11vw, 9rem);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--background);
      color: var(--foreground);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(255, 255, 255, 0.72) 0,
          rgba(255, 255, 255, 0.26) 32%,
          transparent 67%
        );
      transform: translate3d(-1.5%, 0, 0) scale(1);
      animation: ambient-shift 14s ease-in-out infinite alternate;
    }

    main {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding:
        max(var(--page-padding), env(safe-area-inset-top))
        max(var(--page-padding), env(safe-area-inset-right))
        max(var(--page-padding), env(safe-area-inset-bottom))
        max(var(--page-padding), env(safe-area-inset-left));
    }

    .identity {
      width: min(100%, 90rem);
      text-align: center;
      animation: entrance 550ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin: 0;
      font-family:
        "Iowan Old Style",
        "Palatino Linotype",
        "Book Antiqua",
        Palatino,
        Georgia,
        serif;
      font-size: var(--title-size);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .lede {
      max-width: 38rem;
      margin: clamp(1rem, 3vw, 1.75rem) auto 0;
      color: var(--foreground);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      font-weight: 400;
      line-height: 1.5;
      text-wrap: balance;
    }

    .principle {
      max-width: 36rem;
      margin: clamp(0.4rem, 1.2vw, 0.6rem) auto 0;
      color: var(--muted);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: clamp(0.85rem, 1.7vw, 1.02rem);
      font-weight: 400;
      line-height: 1.5;
      text-wrap: balance;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      margin: clamp(1.8rem, 4vw, 3rem) 0 0;
      color: var(--muted);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: clamp(0.68rem, 1.2vw, 0.78rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 2.75rem;
      height: 1px;
      background: var(--line);
    }

    @keyframes ambient-shift {
      from {
        transform: translate3d(-1.5%, 0, 0) scale(1);
      }

      to {
        transform: translate3d(1.5%, -1%, 0) scale(1.04);
      }
    }

    @media (max-width: 35rem) {
      h1 {
        letter-spacing: -0.045em;
      }

      .status {
        gap: 0.65rem;
      }

      .status::before {
        width: 2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      .identity {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    @media (forced-colors: active) {
      body::before {
        display: none;
      }

      .status::before {
        background: currentColor;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="identity" aria-labelledby="site-name">
      <h1 id="site-name">Varde Ark</h1>
      <p class="lede">Utvikler korte, sporbare beslutningsgrunnlag for operativ ledelse.</p>
      <p class="principle">Fra spredt rapportering til et avgrenset grunnlag å handle på — med mennesket fortsatt ansvarlig for beslutningen.</p>
      <p class="status">Under utvikling</p>
    </section>
  </main>
</body>
</html>
